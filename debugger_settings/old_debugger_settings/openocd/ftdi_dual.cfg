# Minimal FT2232H setup for Efinix JTAG (no device_desc!)
interface ftdi
transport select jtag

# Your USB VID:PID
ftdi vid_pid 0x0403 0x6010

# Use channel 1 (the JTAG port on most FT2232H boards)
ftdi channel 1

# Reset lines are not used on external dongles
reset_config none

# Reasonable default; OpenOCD may lower it
adapter speed 6000
