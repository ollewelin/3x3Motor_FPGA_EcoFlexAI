# ===== Interface: FT2232H (JTAG on Channel B) =====
adapter driver ftdi
transport select jtag

# Your FTDI VID/PID (from Programmer log 0x0403:0x6010)
ftdi vid_pid 0x0403 0x6010

# JTAG is on .../2 -> Channel B (1). If this fails, try 0.
ftdi channel 1

# No wired SRST/TRST on typical pods; rely on RISC-V debug halt
reset_config none

# JTAG speed that worked in Efinix Programmer
adapter speed 6000

# ===== Target: Efinix Trion (RISC-V DM over JTAG) =====
# Your board reports IDCODE 0x00210A79
jtag newtap efinix tap -expected-id 0x00210a79 -irlen 8

# Single-core RISC-V target bound to that TAP
set _TARGET efinix.cpu
target create $_TARGET riscv -chain-position efinix.tap

# Optional: make GDB more forgiving on memory maps
riscv set_enable_virt2phys off
