set  _ENDIAN little
set _TAP_TYPE 1234

gdb_target_description disable
set cpu_count 1
set instr_addr 0x00001000

# Eclipse/GDB connect behavior varies by version and can trigger immediate
# halt attempts. Make halt/resume-on-connect optional so we can keep the
# GDB session alive even if halting is unreliable.
#
# Usage:
#   openocd -c "set GDB_ATTACH_HALT 1" ...
#   openocd -c "set GDB_DETACH_RESUME 1" ...
if { ![info exists GDB_ATTACH_HALT] } {
    set GDB_ATTACH_HALT 0
}
if { ![info exists GDB_DETACH_RESUME] } {
    set GDB_DETACH_RESUME 0
}

if { $LEGACY_IDE == 0 } {
    # Prefer an explicit project base passed by Eclipse.
    # The launch config sets bsp_loc to embedded_sw/RISC_V_standard_A.
    if { [info exists bsp_loc] } {
        set proj_loc $bsp_loc
    } else {
        # Initialize proj_loc to an empty string
        set proj_loc ""

        # Maximum levels to go up (adjust as needed)
        set max_levels 3

        # Loop through parent directories
        for {set i 0} {$i <= $max_levels} {incr i} {
            set path ".."
            for {set j 0} {$j < $i} {incr j} {
                append path "/.."
            }
            set yaml_path "$path/cpu0.yaml"

            if {[file exists $yaml_path]} {
                set proj_loc $path
                break
            }
        }

        # If cpu.yaml was found, proceed
        if {$proj_loc != ""} {
            #puts "Found cpu.yaml at: $proj_loc"
        } else {
            puts "cpu.yaml not found within $max_levels levels"
        }
    }

    #set proj_loc ..//..//..//
    
    # Lower JTAG speed to improve reliability (especially halting).
    adapter speed 200
    adapter srst delay 260
    jtag_ntrst_delay 250
    
    set _CHIPNAME fpga_spinal
    jtag newtap $_CHIPNAME bridge -expected-id $_CPUTAPID -irlen 4 -ircapture 0x5 -irmask 0xF
    
    if { $STANDARD_DEBUG == 0 } { # non-standard debug interface 
        for {set i 0} {$i < $cpu_count} {incr i} {
            target create $_CHIPNAME.cpu$i vexriscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid $i -dbgbase [expr $i*0x1000+0x10B80000] -work-area-phys 0xF9000000 -work-area-size 1024
            vexriscv readWaitCycles 40
            vexriscv cpuConfigFile $proj_loc/cpu$i.yaml
            vexriscv jtagMapping 8 8 0 1 2 2  

            if { $GDB_ATTACH_HALT } {
                # Some IDEs probe registers/memory immediately on connect.
                # If halting is reliable, doing it here avoids confusing reads.
                $_CHIPNAME.cpu$i configure -event gdb-attach { catch { halt } ; sleep 50 ; catch { halt } ; sleep 50 ; catch { halt } }
            }
            if { $GDB_DETACH_RESUME } {
                $_CHIPNAME.cpu$i configure -event gdb-detach { catch { resume } }
                $_CHIPNAME.cpu$i configure -event gdb-end { catch { resume } }
            }
        }
    } else {  # standard debug interface 
	if { $cpu_count > 1 && [info exists RUN_SMP_APP] } {
		target create $_CHIPNAME.cpu0 riscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid 0 -dbgbase [expr 0*0x1000+0x10B80000] -work-area-phys 0xF9000000 -work-area-size 1024 -rtos hwthread
		for {set i 1} {$i < $cpu_count} {incr i} {			
        		target create $_CHIPNAME.cpu$i riscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid $i -dbgbase [expr $i*0x1000+0x10B80000] -work-area-phys 0xF9000000 -work-area-size 1024
    		}
		riscv use_bscan_tunnel 6 1
        riscv set_bscan_tunnel_ir 8 
        # Eclipse/GDB often probes memory immediately on connect.
        # Make halting more reliable and avoid spurious timeouts.
        riscv set_command_timeout_sec 10
        riscv set_reset_timeout_sec 10
		target smp $_CHIPNAME.cpu0 $_CHIPNAME.cpu1 $_CHIPNAME.cpu2 $_CHIPNAME.cpu3

		for {set i 0} {$i < $cpu_count} {incr i} {
                    if { $GDB_ATTACH_HALT } {
                        $_CHIPNAME.cpu$i configure -event gdb-attach { catch { halt } ; sleep 50 ; catch { halt } ; sleep 50 ; catch { halt } }
                    }
                    if { $GDB_DETACH_RESUME } {
				$_CHIPNAME.cpu$i configure -event gdb-detach { catch { resume } }
                        $_CHIPNAME.cpu$i configure -event gdb-end { catch { resume } }
                    }
		}

	} else {
		for {set i 0} {$i < $cpu_count} {incr i} {
		    target create $_CHIPNAME.cpu$i riscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid $i -dbgbase [expr $i*0x1000+0x10B80000] -work-area-phys 0xF9000000 -work-area-size 1024
		    riscv use_bscan_tunnel 6 1
		    riscv set_bscan_tunnel_ir 8

                # Eclipse/GDB often probes memory immediately on connect.
                # Make halting more reliable and avoid spurious timeouts.
                riscv set_command_timeout_sec 10
                riscv set_reset_timeout_sec 10

                if { $GDB_ATTACH_HALT } {
                    $_CHIPNAME.cpu$i configure -event gdb-attach { catch { halt } ; sleep 50 ; catch { halt } ; sleep 50 ; catch { halt } }
                }
                if { $GDB_DETACH_RESUME } {
		    $_CHIPNAME.cpu$i configure -event gdb-detach { catch { resume } }
                    $_CHIPNAME.cpu$i configure -event gdb-end { catch { resume } }
                }
        	}
		}
    riscv resume_order reversed
    }

    #insert target tap(s) info#
    #start#
    
    #end#
    
    for {set i 0} {$i < $cpu_count} {incr i} {
        targets $_CHIPNAME.cpu$i
        poll_period 50
        init
        if { [info exists AUTO_HALT] && $AUTO_HALT } {
            catch { halt }
        }

        # OpenOCD's target init sets a default gdb-attach handler (typically
        # 'halt 1000'). Override it after init so we can disable halt-on-connect
        # when halting is unstable.
        if { $GDB_ATTACH_HALT } {
            catch { $_CHIPNAME.cpu$i configure -event gdb-attach { catch { halt } ; sleep 50 ; catch { halt } ; sleep 50 ; catch { halt } } }
        } else {
            catch { $_CHIPNAME.cpu$i configure -event gdb-attach { } }
        }

        if { $GDB_DETACH_RESUME } {
            catch { $_CHIPNAME.cpu$i configure -event gdb-detach { catch { resume } } }
            catch { $_CHIPNAME.cpu$i configure -event gdb-end { catch { resume } } }
        } else {
            catch { $_CHIPNAME.cpu$i configure -event gdb-detach { } }
            catch { $_CHIPNAME.cpu$i configure -event gdb-end { } }
        }
    }
    
    if { [info exists RUN_SMP_APP] && $STANDARD_DEBUG == 0 } {
        targets $_CHIPNAME.cpu0
        
        load_image $proj_loc/software/standalone/smp/smpDemo/build/smpDemo.bin $instr_addr
        
        set i $cpu_count
        incr i -1
        for {} {$i >= 0} {incr i -1} {
            targets $_CHIPNAME.cpu$i
            reg x10 0
            reg x11 0
            resume $instr_addr
        }
        puts "Start running smpDemo apps"
    }
    
} else {
    set workspace $::env(workspace_loc)
    
    adapter_khz 800
    adapter_nsrst_delay 260
    jtag_ntrst_delay 250
    
    set _CHIPNAME fpga_spinal
    jtag newtap $_CHIPNAME bridge -expected-id $_CPUTAPID -irlen 4 -ircapture 0x5 -irmask 0xF
   
    if { $STANDARD_DEBUG == 0 } {
        for {set i 0} {$i < $cpu_count} {incr i} {
            target create $_CHIPNAME.cpu$i vexriscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid $i -dbgbase [expr $i*0x1000+0x10B80000] -work-area-phys 0xF9000000 -work-area-size 1024
            vexriscv readWaitCycles 40
            vexriscv cpuConfigFile $workspace/cpu$i.yaml
            vexriscv jtagMapping 8 8 0 1 2 2  

            if { $GDB_ATTACH_HALT } {
                $_CHIPNAME.cpu$i configure -event gdb-attach { catch { halt } }
            }
            if { $GDB_DETACH_RESUME } {
                $_CHIPNAME.cpu$i configure -event gdb-detach { catch { resume } }
                $_CHIPNAME.cpu$i configure -event gdb-end { catch { resume } }
            }
        }
    } else {
        for {set i 0} {$i < $cpu_count} {incr i} {
            target create $_CHIPNAME.cpu$i riscv -endian $_ENDIAN -chain-position $_CHIPNAME.bridge -coreid $i -dbgbase [expr $i*0x1000+0x10B80000] -work-area-phys 0xF9000000 -work-area-size 1024
            riscv use_bscan_tunnel 6 1
            riscv set_bscan_tunnel_ir 8

            if { $GDB_ATTACH_HALT } {
                $_CHIPNAME.cpu$i configure -event gdb-attach { catch { halt } }
            }
            if { $GDB_DETACH_RESUME } {
                $_CHIPNAME.cpu$i configure -event gdb-detach { catch { resume } }
                $_CHIPNAME.cpu$i configure -event gdb-end { catch { resume } }
            }
        }
    }
 
    for {set i 0} {$i < $cpu_count} {incr i} {
        targets $_CHIPNAME.cpu$i
        poll_period 50
        init
        #soft_reset_halt
        halt
    }
    
    if { [info exists RUN_SMP_APP] } {
        targets $_CHIPNAME.cpu0
        
        load_image $workspace/software/standalone/smp/smpDemo/build/smpDemo.bin $instr_addr
        
        set i $cpu_count
        incr i -1
        for {} {$i >= 0} {incr i -1} {
            targets $_CHIPNAME.cpu$i
            reg x10 0
            reg x11 0
            resume $instr_addr
        }
        puts "Start running smpDemo apps"
    
    }
}

