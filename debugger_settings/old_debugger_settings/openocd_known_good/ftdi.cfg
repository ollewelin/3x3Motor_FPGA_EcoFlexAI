set LEGACY_IDE 0

# STANDARD_DEBUG:
#   0 = VexRiscv non-standard debug (recommended for this build)
#   1 = Standard RISC-V debug (DM/DTM)
# Allow overriding from command line: openocd -c "set STANDARD_DEBUG 0" ...
if { ![info exists STANDARD_DEBUG] } {
    set STANDARD_DEBUG 0
}

# NOTE (Linux): the Trion T120F324 dev board FTDI often enumerates as
#   "Dual RS232-HS" (VID:PID 0403:6010), not "Trion T120F324 Development Board".
# Allow overriding the descriptor via a Tcl variable passed on the command line:
#   openocd -c "set FTDI_DEVICE_DESC {Dual RS232-HS}" -f ftdi.cfg -f debug.cfg
if { [info exists FTDI_DEVICE_DESC] } {
    set _FTDI_DEVICE_DESC $FTDI_DEVICE_DESC
} else {
    set _FTDI_DEVICE_DESC "Dual RS232-HS"
}

if { [info exists CPUTAPID] } {
   set _CPUTAPID $CPUTAPID
} else {
  # set useful default
   set _CPUTAPID 0x00220a79
}

if { $LEGACY_IDE == 0 } {
    adapter driver ftdi
    ftdi device_desc $_FTDI_DEVICE_DESC
    ftdi vid_pid 0x0403 0x6010

    # Channel for using JTAG. 0 => channel A, 1 => channel B
    ftdi channel 1

    #  name   signal  state      direction  JTAG name
    # *DBUS0  TCK/SK  (low =0)   (out=1)
    # *DBUS1  TDI/DO  (low =0)   (out=1)
    # *DBUS2  TDO/DI  (low =0)   (in =0)
    # *DBUS3  TMS/CS  (high=1)   (out=1)
    # *DBUS4  GPIOL0  (low =0)   (out=0)    (nTRST)
    # *DBUS5  GPIOL1  (low =0)   (out=0)    WAIT | STOPCLK
    # *DBUS6  GPIOL2  (low =0)   (out=0)    (nRST)
    # *DBUS7  GPIOL3  (low =0)   (out=0)    RTCK
    ftdi layout_init 0x08 0x0b
} else {
    interface ftdi
    ftdi_device_desc $_FTDI_DEVICE_DESC
    ftdi_vid_pid 0x0403 0x6010

    # Channel for using JTAG. 0 => channel A, 1 => channel B
    ftdi_channel 1

    #  name   signal  state      direction  JTAG name
    # *DBUS0  TCK/SK  (low =0)   (out=1)
    # *DBUS1  TDI/DO  (low =0)   (out=1)
    # *DBUS2  TDO/DI  (low =0)   (in =0)
    # *DBUS3  TMS/CS  (high=1)   (out=1)
    # *DBUS4  GPIOL0  (low =0)   (out=0)    (nTRST)
    # *DBUS5  GPIOL1  (low =0)   (out=0)    WAIT | STOPCLK
    # *DBUS6  GPIOL2  (low =0)   (out=0)    (nRST)
    # *DBUS7  GPIOL3  (low =0)   (out=0)    RTCK
    ftdi_layout_init 0x08 0x0b
}


