# Local OpenOCD wrapper for this workspace — overrides FTDI selection
# Usage:
#   sudo openocd -f olle_ftdi_wrap.cfg -f embedded_sw/SoC_mini_A/bsp/efinix/EfxSapphireSoc/openocd/debug_softTap.cfg
# Or to override the CPU TAP ID if needed:
#   sudo openocd -c "set CPUTAPID 0x10660A79" -f olle_ftdi_wrap.cfg -f embedded_sw/SoC_mini_A/bsp/efinix/EfxSapphireSoc/openocd/debug_softTap.cfg

# Source the vendor FTDI config so we inherit layout/init and other defaults
source [find embedded_sw/SoC_mini_A/bsp/efinix/EfxSapphireSoc/openocd/ftdi_ti.cfg]

# Override USB selection to the FT2232H device detected on this machine
# (lsusb showed 0403:6010). Adjust channel if your hardware uses the other channel.
ftdi vid_pid 0x0403 0x6010
ftdi device_desc "Dual RS232-HS"
ftdi channel 1

# FTDI clock speed (kHz)
adapter speed 1000

# Default CPU TAP ID detected on this board — override with -c "set CPUTAPID <id>" if different
set CPUTAPID 0x10660A79

# Debug mode flags
set LEGACY_IDE 0
set STANDARD_DEBUG 1
